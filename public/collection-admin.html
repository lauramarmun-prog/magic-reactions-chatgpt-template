<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Magic Reactions · Private collection</title>
    <style>
      :root{color-scheme:light;--ink:#2b2036;--soft:#f7f2ff;--line:#dfd1ef;--brand:#7651a8;--danger:#9d3153}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fbf7ff,#f4edff);color:var(--ink);font:16px/1.45 system-ui,sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:30px auto 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{display:flex;gap:14px;align-items:center}.mark{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:#eadcff;font-size:28px}h1,h2,p{margin:0}.sub{color:#685a76}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 18px 55px #56377614;margin-top:18px}.row{display:flex;gap:12px;flex-wrap:wrap}.field{display:grid;gap:7px;flex:1 1 210px}label{font-weight:750}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #cfbce4;border-radius:13px;padding:11px;background:white}button{border:0;border-radius:13px;padding:11px 16px;background:var(--brand);color:white;font-weight:800;cursor:pointer}.soft{background:#eadcff;color:#4d326f}.danger{background:#f6dce5;color:var(--danger)}.status{min-height:24px;margin-top:12px;color:#6a5878}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}.item{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.item img{width:100%;height:210px;object-fit:contain;background:var(--soft)}.body{padding:14px}.meta{font-size:13px;color:#766782;margin:5px 0 12px}.actions{display:flex;gap:8px}.actions button{flex:1}.empty{padding:40px;text-align:center;color:#756683}@media(max-width:620px){.top{align-items:flex-start;flex-direction:column}.shell{margin-top:18px}.card{padding:16px}}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top"><div class="brand"><div class="mark">✨</div><div><h1>Magic Reactions</h1><p class="sub">Your private GIF and sticker collection.</p></div></div><strong id="count">0 reactions</strong></header>

      <section class="card">
        <h2>Owner access</h2>
        <p class="sub">Use the OWNER_CODE generated for this Railway deployment. It stays only in this browser tab.</p>
        <div class="row" style="margin-top:14px"><div class="field"><label for="owner-code">Owner code</label><input id="owner-code" type="password" autocomplete="current-password"></div><div style="align-self:end"><button id="connect" type="button">Open collection</button></div></div>
        <p class="status" id="status"></p>
      </section>

      <section class="card">
        <h2>Add a custom reaction</h2>
        <form id="upload-form">
          <div class="row" style="margin-top:14px">
            <div class="field"><label for="file">Image</label><input id="file" type="file" accept="image/gif,image/webp,image/png,image/jpeg" required></div>
            <div class="field"><label for="title">Title</label><input id="title" maxlength="100" required></div>
            <div class="field"><label for="kind">Type</label><select id="kind"><option value="sticker">Sticker</option><option value="gif">GIF</option></select></div>
          </div>
          <div class="row" style="margin-top:12px">
            <div class="field"><label for="tags">Tags</label><input id="tags" placeholder="hug, happy, celebration"></div>
            <div class="field"><label for="moods">Moods</label><input id="moods" placeholder="comfort, joy"></div>
            <div class="field"><label for="use-when">Use when</label><input id="use-when" placeholder="when someone needs a hug"></div>
          </div>
          <div class="field" style="margin-top:12px"><label for="description">Description</label><textarea id="description" rows="3" maxlength="500"></textarea></div>
          <button style="margin-top:14px" type="submit">Save reaction</button>
        </form>
      </section>

      <section class="card">
        <div class="row"><div class="field"><label for="search">Filter collection</label><input id="search" placeholder="Search titles and tags"></div><div style="align-self:end"><button class="soft" id="refresh" type="button">Refresh</button></div></div>
        <div class="grid" id="grid"><p class="empty">Enter the owner code to open your collection.</p></div>
      </section>
    </main>
    <script>
      const $=(selector)=>document.querySelector(selector);let items=[];const ownerCode=()=>$("#owner-code").value.trim();const auth=()=>({authorization:`Bearer ${ownerCode()}`,"content-type":"application/json"});
      function say(message,error=false){$("#status").textContent=message;$("#status").style.color=error?"#9d3153":"#5c4376"}
      async function api(path,options={}){const response=await fetch(path,options);const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||`Request failed (${response.status})`);return body}
      function words(value){return value.split(",").map(v=>v.trim()).filter(Boolean)}
      function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
      function render(){const phrase=$("#search").value.trim().toLowerCase();const visible=items.filter(item=>!phrase||[item.title,item.description,...item.tags,...item.moods,...item.useWhen].join(" ").toLowerCase().includes(phrase));$("#count").textContent=`${items.length} reaction${items.length===1?"":"s"}`;$("#grid").innerHTML=visible.length?visible.map(item=>`<article class="item"><img src="${escapeHtml(item.previewUrl||item.imageUrl)}" alt=""><div class="body"><strong>${escapeHtml(item.title)}</strong><p class="meta">${escapeHtml(item.kind)} · ${escapeHtml(item.source)} · priority ${item.priority}</p><div class="actions"><button class="soft" data-edit="${item.id}">Edit</button><button class="danger" data-hide="${item.id}">Hide</button></div></div></article>`).join(""):`<p class="empty">The collection is empty. Add the first reaction above.</p>`}
      async function load(){if(!ownerCode())return say("Enter the owner code first.",true);try{const body=await api("/api/collection?all=1",{headers:auth()});items=body.items||[];render();say("Private collection ready.")}catch(error){say(error.message,true)}}
      $("#connect").onclick=load;$("#refresh").onclick=load;$("#search").oninput=render;
      $("#upload-form").onsubmit=async(event)=>{event.preventDefault();if(!ownerCode())return say("Enter the owner code first.",true);const file=$("#file").files[0];if(!file)return;const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=reject;reader.readAsDataURL(file)});try{await api("/api/collection/custom",{method:"POST",headers:auth(),body:JSON.stringify({base64,mimeType:file.type,title:$("#title").value,kind:$("#kind").value,tags:words($("#tags").value),moods:words($("#moods").value),useWhen:words($("#use-when").value),description:$("#description").value})});event.target.reset();say("Reaction saved.");await load()}catch(error){say(error.message,true)}};
      $("#grid").onclick=async(event)=>{const id=event.target.dataset.hide||event.target.dataset.edit;if(!id)return;const item=items.find(value=>value.id===id);if(event.target.dataset.hide){if(!confirm(`Hide “${item.title}”? The image will remain recoverable.`))return;try{await api(`/api/collection/${id}`,{method:"DELETE",headers:auth()});await load()}catch(error){say(error.message,true)}return}const title=prompt("Title",item.title);if(title===null)return;const tags=prompt("Tags, comma separated",item.tags.join(", "));if(tags===null)return;try{await api(`/api/collection/${id}`,{method:"PATCH",headers:auth(),body:JSON.stringify({title,tags:words(tags)})});await load()}catch(error){say(error.message,true)}};
    </script>
  </body>
</html>
