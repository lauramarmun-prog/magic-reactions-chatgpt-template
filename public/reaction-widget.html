<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magic Reaction</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 4px;
        background: transparent;
      }

      .reaction {
        width: min(100%, 380px);
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(177, 130, 224, 0.46);
        border-radius: 24px;
        background: linear-gradient(145deg, #2b2135, #201927);
        box-shadow: 0 12px 32px rgba(37, 23, 50, 0.22);
      }

      .frame {
        display: grid;
        min-height: 150px;
        place-items: center;
        overflow: hidden;
        background: rgba(21, 16, 27, 0.7);
      }

      img {
        display: none;
        width: 100%;
        max-height: 380px;
        object-fit: contain;
      }

      img.ready {
        display: block;
      }

      .status {
        margin: 0;
        padding: 36px 22px;
        color: #e4d4f3;
        font-size: 14px;
        text-align: center;
      }

      .credit {
        margin: 0;
        padding: 10px 14px 11px;
        color: #d7c2e8;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-align: center;
        text-transform: uppercase;
      }

      @media (prefers-color-scheme: light) {
        .reaction {
          background: linear-gradient(145deg, #f4ecfb, #e9dcf5);
        }

        .frame {
          background: rgba(255, 255, 255, 0.56);
        }

        .status,
        .credit {
          color: #604477;
        }
      }
    </style>
  </head>
  <body>
    <figure class="reaction" aria-live="polite">
      <div class="frame">
        <p class="status" id="status">Despertando una reacción bonita…</p>
        <img id="reaction-image" alt="" />
      </div>
      <figcaption class="credit" id="credit" hidden>Powered by GIPHY</figcaption>
    </figure>

    <script type="module">
      const protocolVersion = "2026-01-26";
      const statusEl = document.querySelector("#status");
      const imageEl = document.querySelector("#reaction-image");
      const creditEl = document.querySelector("#credit");
      const isStandalonePreview = new URLSearchParams(location.search).has(
        "preview",
      );
      const diagnosticEndpoint =
        "https://widget-diagnostic.invalid/api/widget-diagnostic";
      const diagnosticStages = new Set([
        "widget-loaded",
        "bridge-initialized",
        "tool-result-received",
        "image-ready",
        "image-error",
      ]);
      const sentDiagnostics = new Set();
      const pendingRequests = new Map();
      let rpcId = 0;
      let currentImageUrl = "";
      let imageLoadState = "idle";
      let reactionRendered = false;
      let openAiRetryTimers = [];

      function emitDiagnostic(stage) {
        if (
          isStandalonePreview ||
          !diagnosticStages.has(stage) ||
          sentDiagnostics.has(stage) ||
          typeof window.fetch !== "function"
        ) {
          return;
        }
        try {
          const url = new URL(diagnosticEndpoint);
          url.searchParams.set("stage", stage);
          sentDiagnostics.add(stage);
          void window.fetch(url.toString(), {
            method: "POST",
            mode: "cors",
            credentials: "omit",
            referrerPolicy: "no-referrer",
            keepalive: true,
          }).catch(() => {});
        } catch {
          // Diagnostics must never interrupt the reaction.
        }
      }

      emitDiagnostic("widget-loaded");

      function rpcNotify(method, params) {
        const message = { jsonrpc: "2.0", method };
        if (params !== undefined) message.params = params;
        window.parent.postMessage(message, "*");
      }

      function rpcRequest(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++rpcId;
          pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage(
            { jsonrpc: "2.0", id, method, params },
            "*",
          );
        });
      }

      function setupAutoResize() {
        let scheduled = false;
        let previousWidth = 0;
        let previousHeight = 0;
        const schedule =
          typeof window.requestAnimationFrame === "function"
            ? window.requestAnimationFrame.bind(window)
            : (callback) => setTimeout(callback, 0);

        const reportSize = () => {
          if (scheduled) return;
          scheduled = true;
          schedule(() => {
            scheduled = false;
            const root = document.documentElement;
            const savedHeight = root?.style?.height || "";
            if (root?.style) root.style.height = "max-content";
            const height = Math.ceil(
              root?.getBoundingClientRect?.().height ||
                document.body?.getBoundingClientRect?.().height ||
                0,
            );
            if (root?.style) root.style.height = savedHeight;
            const width = Math.ceil(window.innerWidth || 0);
            if (width === previousWidth && height === previousHeight) return;
            previousWidth = width;
            previousHeight = height;
            rpcNotify("ui/notifications/size-changed", { width, height });
          });
        };

        reportSize();
        if (typeof window.ResizeObserver !== "function") return () => {};
        const observer = new window.ResizeObserver(reportSize);
        if (document.documentElement) observer.observe(document.documentElement);
        if (document.body) observer.observe(document.body);
        return () => observer.disconnect();
      }

      function allowedReactionImage(value) {
        try {
          const url = new URL(value);
          return url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function resultCandidates(value) {
        const candidates = [];
        const queue = [value];
        const seen = new Set();
        const nestedKeys = [
          "structuredContent",
          "result",
          "_meta",
          "reaction",
          "call_tool_result",
          "mcp_tool_result",
          "callToolResult",
          "mcpToolResult",
        ];

        while (queue.length && candidates.length < 32) {
          const candidate = queue.shift();
          if (!candidate || typeof candidate !== "object" || seen.has(candidate)) {
            continue;
          }
          seen.add(candidate);
          candidates.push(candidate);
          nestedKeys.forEach((key) => {
            if (candidate[key]) queue.push(candidate[key]);
          });
        }

        return candidates;
      }

      function selectedFrom(value) {
        for (const candidate of resultCandidates(value)) {
          if (candidate?.selectedReaction) return candidate.selectedReaction;
          if (candidate?.selectedGiphy) return candidate.selectedGiphy;
          if (
            candidate?.imageUrl &&
            (candidate?.source || candidate?.title || candidate?.kind)
          ) {
            return candidate;
          }
        }
        return null;
      }

      function nativeImageFrom(value) {
        for (const candidate of resultCandidates(value)) {
          const content = Array.isArray(candidate?.content)
            ? candidate.content
            : [];
          const image = content.find(
            (item) =>
              item?.type === "image" &&
              /^image\/(?:gif|webp|png|jpeg)$/.test(item?.mimeType || "") &&
              typeof item?.data === "string" &&
              item.data.length > 0 &&
              item.data.length <= 5_400_000,
          );
          if (image) {
            return {
              source: "native",
              title: "Magic Reaction",
              imageUrl: `data:${image.mimeType};base64,${image.data}`,
            };
          }
        }
        return null;
      }

      function stopOpenAiRetries() {
        openAiRetryTimers.forEach((timer) => clearTimeout(timer));
        openAiRetryTimers = [];
      }

      function markImageReady(imageUrl) {
        if (currentImageUrl !== imageUrl) return;
        statusEl.hidden = true;
        imageEl.classList.add("ready");
        imageLoadState = "ready";
        reactionRendered = true;
        stopOpenAiRetries();
        emitDiagnostic("image-ready");
      }

      function showImage(selected) {
        const imageUrl = String(selected?.imageUrl || "");
        const isNativeImage = imageUrl.startsWith("data:image/");
        if (!isNativeImage && !allowedReactionImage(imageUrl)) return false;

        if (currentImageUrl === imageUrl && imageLoadState !== "error") {
          if (imageEl.complete && imageEl.naturalWidth > 0) {
            markImageReady(imageUrl);
          }
          return true;
        }

        currentImageUrl = imageUrl;
        imageLoadState = "loading";
        reactionRendered = false;
        imageEl.classList.remove("ready");
        statusEl.hidden = false;
        statusEl.textContent = "Despertando una reacción bonita…";
        imageEl.alt = String(selected.title || "Reacción animada");
        creditEl.hidden = selected.source !== "giphy";
        imageEl.addEventListener(
          "load",
          () => {
            markImageReady(imageUrl);
          },
          { once: true },
        );
        imageEl.addEventListener(
          "error",
          () => {
            if (
              currentImageUrl !== imageUrl ||
              imageLoadState === "ready"
            ) {
              return;
            }
            imageLoadState = "error";
            reactionRendered = false;
            imageEl.classList.remove("ready");
            statusEl.hidden = false;
            statusEl.textContent = "La reacción llegó, pero no pudo mostrarse.";
            emitDiagnostic("image-error");
          },
          { once: true },
        );
        imageEl.src = imageUrl;
        if (imageEl.complete && imageEl.naturalWidth > 0) {
          markImageReady(imageUrl);
        }
        return true;
      }

      function render(value) {
        const selected = selectedFrom(value) || nativeImageFrom(value);
        if (!selected || !showImage(selected)) {
          if (reactionRendered) return true;
          statusEl.hidden = false;
          statusEl.textContent = "Esperando la reacción del chat…";
          return false;
        }
        return true;
      }

      function renderToolResult(value, definite = false) {
        const hasValue =
          value !== null &&
          value !== undefined &&
          (typeof value !== "object" || Object.keys(value).length > 0);
        if (definite || hasValue) {
          emitDiagnostic("tool-result-received");
        }
        return render(value);
      }

      function renderOpenAiGlobals() {
        if (reactionRendered) return true;
        for (const value of [
          window.openai?.toolOutput,
          window.openai?.toolResponseMetadata,
        ]) {
          if (value && renderToolResult(value)) return true;
        }
        return false;
      }

      function scheduleOpenAiRetries() {
        stopOpenAiRetries();
        if (reactionRendered) return;
        openAiRetryTimers = [0, 50, 250, 1000].map((delay) =>
          setTimeout(() => {
            if (!reactionRendered) renderOpenAiGlobals();
          }, delay),
        );
      }

      window.addEventListener(
        "openai:set_globals",
        (event) => {
          const globals = event?.detail?.globals;
          if (
            !renderToolResult(globals?.toolOutput) &&
            !renderToolResult(globals?.toolResponseMetadata)
          ) {
            renderOpenAiGlobals();
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;

          if (message.method === "ping" && message.id !== undefined) {
            window.parent.postMessage(
              { jsonrpc: "2.0", id: message.id, result: {} },
              "*",
            );
            return;
          }

          if (
            message.id !== undefined &&
            (Object.prototype.hasOwnProperty.call(message, "result") ||
              Object.prototype.hasOwnProperty.call(message, "error"))
          ) {
            const pending = pendingRequests.get(message.id);
            if (!pending) return;
            pendingRequests.delete(message.id);
            if (message.error) pending.reject(message.error);
            else pending.resolve(message.result);
            return;
          }

          if (message.method === "ui/notifications/tool-result") {
            renderToolResult(message.params, true);
          }
        },
        { passive: true },
      );

      const initialOutput = window.openai?.toolOutput;
      if (isStandalonePreview) {
        render({
          selectedReaction: {
            source: "giphy",
            title: "Gatito celebrando",
            imageUrl:
              "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
          },
        });
      } else {
        if (initialOutput) renderToolResult(initialOutput);
        scheduleOpenAiRetries();
        rpcRequest("ui/initialize", {
          appInfo: { name: "magic-reactions-direct", version: "0.1.0" },
          appCapabilities: {},
          protocolVersion,
        })
          .then(() => {
            rpcNotify("ui/notifications/initialized");
            emitDiagnostic("bridge-initialized");
            setupAutoResize();
            renderOpenAiGlobals();
          })
          .catch(() => {
            if (!initialOutput) {
              statusEl.textContent = "Esperando la reacción del chat…";
            }
          });
      }
    </script>
  </body>
</html>
